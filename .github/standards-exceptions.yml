# Standards exceptions for Ninja6-MC/.github
#
# Schema and worked example: standards/README.md section 3.
# An empty `exceptions` list is a statement that this repository conforms; the file is
# required either way (N6-REPO-05).

repo: .github

exceptions:
  - rule: N6-CI-05
    type: transitional
    reason: >
      `main` is now protected: a pull request is required, linear history is enforced,
      administrators are included, and force-push and deletion are blocked. What is still
      missing is the "required status checks must pass" half of the rule — no check names
      are listed, because the standards workflow does not exist yet and a required check
      that never reports blocks every pull request permanently (N6-CI-03).
      The list gets populated once that workflow ships and its check names are stable.
    approved_by: bharathasl74185@gmail.com
    approved_on: 2026-08-19
    revisit_by: 2026-09-19
