name: Standards

# Checks a repository against the mechanically-checkable rules in standards/. The logic
# lives in scripts/check-standards.py in this repository, not inline here, so that it can
# be run locally against a clone before it is ever pushed:
#
#     REGISTER_DIR=../.github/standards REPO=Ninja6-MC/<repo> python3 check-standards.py
#
# This is a REUSABLE workflow. Other Ninja6-MC repos call it rather than copying it, with
# a stub of their own - canonical copy in templates/standards-stub.yml:
#
#     name: Standards
#     on: pull_request
#     jobs:
#       standards:
#         uses: Ninja6-MC/.github/.github/workflows/standards.yml@main   # yes, twice
#
# NOT in a required-status-check list yet, deliberately. N6-CI-03: a required check must
# name a check that actually reports, and the name here (`standards / Check Standards`
# from a stub, `Check Standards` from this repository's own pull_request run) is only
# stable once the stub has landed everywhere. Adding it to a required list is a separate
# change - see the register's adoption notes.
#
# `SessionPulse` deliberately has no stub. It is parked, and it fails five of these
# checks; wiring it up would be a piecemeal change to a repository that is supposed to
# get one full pass instead.

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check Standards
    runs-on: ubuntu-latest

    steps:
      # The repository under test. A called workflow inherits the caller's event
      # payload, so this checks out the CALLER, which is the whole point.
      - name: Checkout the repository under test
        uses: actions/checkout@v4
        with:
          # N6-REPO-03 walks base..head to find who touched assets/, so the full
          # history is needed - a shallow clone has no merge base to walk back to.
          fetch-depth: 0
          path: repo

      # Which ref of THIS repository to read the register and the checker from.
      #
      # `refs/heads/main` is the answer, and it is reached by fallback rather than by
      # any context variable, because ALL THREE candidates turned out to be unusable.
      # Measured, not assumed - each of these cost a merge to discover:
      #
      #   github.job_workflow_sha  documented; empty in this context
      #   github.workflow_ref      populated, but describes the CALLER's workflow - it
      #                            resolved to `refs/pull/24/merge`, the caller's own
      #                            pull request, and the checkout failed with
      #                            `couldn't find remote ref`
      #   github.job_workflow_ref  also empty - logged as `job_workflow_ref = ''` on the
      #                            first green run
      #
      # So main is the working path, not a degraded one, and it is correct for every
      # caller today: every stub pins `@main`, and the register a repository is judged
      # against should be the one the workflow it called was published from.
      #
      # `job_workflow_ref` is still read first, so that if GitHub ever starts populating
      # it - or if a caller pins a tag - the exact ref is used automatically. That is an
      # optimisation, not the mechanism. It does not warn when it is empty, because a
      # warning that fires on every single run is noise, and noise is how real warnings
      # get ignored.
      - name: Resolve the register ref
        if: github.repository != 'Ninja6-MC/.github'
        id: register
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: |
          if [ -n "$JOB_WORKFLOW_REF" ] && [ "${JOB_WORKFLOW_REF##*@}" != "$JOB_WORKFLOW_REF" ]; then
            REF="${JOB_WORKFLOW_REF##*@}"
            echo "Pinned from job_workflow_ref."
          else
            REF="refs/heads/main"
            echo "job_workflow_ref is empty; using main, which is what every stub pins."
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Register ref: $REF"

      # Skipped when this repository is the one under test: nothing called the workflow,
      # so the checkout above is already this repository at the PR head. Reusing it means
      # a pull request that edits the register is checked against its own version rather
      # than against main, which is what you want when the register itself is the change.
      - name: Checkout the register
        if: github.repository != 'Ninja6-MC/.github'
        uses: actions/checkout@v4
        with:
          repository: Ninja6-MC/.github
          ref: ${{ steps.register.outputs.ref }}
          path: register

      - name: Check standards
        working-directory: repo
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Same condition as the two steps above, and it has to stay in step with them:
          # `register/` exists only when this repository is not the one under test.
          if [ "$REPO" = "Ninja6-MC/.github" ]; then
            ROOT="$GITHUB_WORKSPACE/repo"
          else
            ROOT="$GITHUB_WORKSPACE/register"
          fi
          REGISTER_DIR="$ROOT/standards"
          CHECKER="$ROOT/scripts/check-standards.py"
          export REGISTER_DIR

          # Fail loudly rather than skipping. A checker that silently does not run is
          # worse than no checker, because the green tick says the opposite.
          if [ ! -f "$CHECKER" ]; then
            echo "::error::Checker not found at $CHECKER"
            exit 1
          fi

          python3 "$CHECKER"
