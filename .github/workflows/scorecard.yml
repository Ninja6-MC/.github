name: Scorecard

# OpenSSF Scorecard. Scores the repository's security posture - pinned dependencies,
# workflow token permissions, branch protection, dangerous workflow patterns - and
# uploads the result to code scanning, where it shows up as alerts rather than as a
# number nobody looks at.
#
# This is a REUSABLE workflow, like dco.yml and standards.yml. Canonical caller stub is
# templates/scorecard-stub.yml. That stub is longer than the other two, and has to be:
# `security-events: write` and `id-token: write` cannot be granted by the called
# workflow alone. A called workflow's permissions are capped by what the CALLING job
# grants, so the grant has to appear in the caller.
#
# PUBLIC REPOSITORIES ONLY. Two independent reasons:
#   - `publish_results` requires a public repository
#   - uploading SARIF to code scanning needs GitHub Advanced Security on a private repo,
#     which the Free plan does not include
# So `brand` gets no stub. That is a platform limit, the same one already recorded as
# the permanent N6-BRANCH-01 exception, not an oversight.
#
# NOT a pull-request check. Scorecard scores the repository, not a diff, and the action
# does not support the pull_request event. It runs on a schedule, on pushes to main, and
# on demand - so it never reports a check name, and nothing here belongs in a
# required-status-check list.
#
# Actions are pinned to COMMIT shas, not tags. Scorecard's own Pinned-Dependencies check
# flags mutable tags, and a workflow that scores dependency pinning while floating on
# tags would be embarrassing. Note that two of these tags are ANNOTATED - the tag ref's
# object sha is the tag object, not the commit, and pinning to that fails - so each was
# dereferenced to its commit before being written down.

on:
  workflow_call:

  # This repository's own schedule. A caller supplies its own triggers.
  schedule:
    # Weekly. Scorecard's inputs change slowly; running it daily would produce identical
    # results and a mailbox nobody reads.
    - cron: '41 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest

    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Read workflow run data - Scorecard inspects the workflows themselves.
      actions: read
      contents: read
      # Publish to the public OpenSSF results store, which is what makes the badge and
      # the API entry work. Requires a public repository.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # No repo_token: the default GITHUB_TOKEN covers a public repository. A PAT is
          # only needed for the branch-protection check to see settings the default token
          # cannot read, and that check is one the register already enforces directly
          # (N6-CI-05), so the extra secret would buy a duplicate answer.
          publish_results: true

      # Kept for 5 days so a failed upload can still be inspected. Without this, a SARIF
      # that code scanning rejects leaves nothing behind to look at.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.30.0
        with:
          sarif_file: results.sarif
