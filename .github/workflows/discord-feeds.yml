name: Discord Feeds

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor sends feeds; preview and digest only prepare files
        type: choice
        options: [preview, monitor, digest]
        default: preview

permissions:
  contents: read

concurrency:
  group: discord-feeds
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'Ninja6-MC/.github' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'monitor')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Durable state writes target only chore/discord-feed-state, never main.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare or deliver public feeds
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_DEV_BUILDS_WEBHOOK: ${{ secrets.DISCORD_DEV_BUILDS_WEBHOOK }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          DISCORD_STAFF_WEBHOOK: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
        run: python3 scripts/discord_feeds.py --mode monitor

  prepare:
    if: github.repository == 'Ninja6-MC/.github' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode != 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare a preview or digest without sending
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_MODE: ${{ inputs.mode }}
        run: python3 scripts/discord_feeds.py --mode "$FEED_MODE" --output discord-feed-output.txt
      - name: Retain preview or digest for manual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discord-feed-draft
          path: discord-feed-output.txt
          if-no-files-found: ignore
          retention-days: 7
