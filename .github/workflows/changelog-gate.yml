name: Changelog Gate

on:
  pull_request:
    paths:
      - '.github/actions/changelog-gate/**'
      - '.github/workflows/changelog-gate.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test Changelog Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Changelog Gate Tests
        run: bash .github/actions/changelog-gate/test.sh
