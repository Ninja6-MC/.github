# Copy to .github/workflows/dco.yml in a new repo. That is the whole file - the
# check itself lives in Ninja6-MC/.github and is maintained in one place.
name: DCO

on: pull_request

# NOTE the doubled `.github`. A reusable workflow is referenced as
# {owner}/{repo}/.github/workflows/{file}@{ref} - and here the repo is itself named
# `.github`, so the segment appears twice. Written once it resolves to the path
# `workflows/dco.yml`, which is not a valid workflow location, and the run fails at
# startup with no jobs and no useful error.
jobs:
  dco:
    uses: Ninja6-MC/.github/.github/workflows/dco.yml@main
